<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Messages</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #111;
      height: 100vh;
      display: flex;
    }
    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      background: #128c7e;
      color: white;
      padding: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,.1);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    .container {
      display: flex;
      gap: 0;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 320px;
      background: #fff;
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-box {
      padding: 8px 12px;
      border-bottom: 1px solid #e5e5e5;
    }
    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      font-size: 13px;
      background: #f0f0f0;
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .chat-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.1s;
    }
    .chat-item:hover {
      background: #f5f5f5;
    }
    .chat-item.active {
      background: #e9e9e9;
    }
    .chat-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .chat-item-phone {
      font-weight: 500;
      font-size: 14px;
    }
    .chat-item-time {
      font-size: 12px;
      color: #999;
    }
    .chat-item-preview {
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .no-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
    }
    .send-form {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      gap: 8px;
    }
    .send-form input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      font-size: 13px;
      font-family: inherit;
    }
    .send-form button {
      padding: 10px 16px;
      background: #128c7e;
      color: white;
      border: 0;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    .send-form button:hover {
      background: #0f7066;
    }
    .send-form button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    .messages-view {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .messages-content {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.5;
      font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
    }
    .status {
      padding: 0 12px;
      color: #666;
      font-size: 13px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <h1>WhatsApp</h1>
    </div>

    <div class="container">
      <div class="sidebar">
        <div class="search-box">
          <input id="phone-filter" type="text" placeholder="Search phone...">
        </div>
        <ul class="chat-list" id="chat-list"></ul>
      </div>

      <div class="chat-view">
        <div id="no-chat" class="no-chat">Select a chat to view messages</div>
        <div id="chat-content" style="display: none; flex: 1; display: flex; flex-direction: column;">
          <div style="padding: 16px; border-bottom: 1px solid #e5e5e5;">
            <div id="chat-title" style="font-size: 16px; font-weight: 600;"></div>
            <div id="chat-meta" style="font-size: 12px; color: #999;"></div>
          </div>
          <div class="status" id="status"></div>
          <div class="messages-view">
            <div class="messages-content" id="messages-content"></div>
          </div>
          <form id="send-form" class="send-form">
            <input name="body" type="text" placeholder="Type a message..." required>
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script>
    const chatList = document.querySelector("#chat-list");
    const phoneFilter = document.querySelector("#phone-filter");
    const noChat = document.querySelector("#no-chat");
    const chatContent = document.querySelector("#chat-content");
    const chatTitle = document.querySelector("#chat-title");
    const chatMeta = document.querySelector("#chat-meta");
    const messagesContent = document.querySelector("#messages-content");
    const sendForm = document.querySelector("#send-form");
    const statusEl = document.querySelector("#status");
    const pageSize = 50;
    let offset = 0;
    let selectedPhone = null;
    let allConversations = [];

    async function loadConversations() {
      const params = new URLSearchParams({ limit: pageSize, offset });
      if (phoneFilter.value.trim()) params.set("phone", phoneFilter.value.trim());
      const response = await fetch(`/messages?${params}`);
      allConversations = await response.json();
      renderChatList();
    }

    function renderChatList() {
      chatList.innerHTML = allConversations.map((conv) => {
        const preview = conv.messages.split('\n')[0].substring(0, 40);
        const lastUpdated = new Date(conv.updated_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        return `
          <li class="chat-item ${selectedPhone === conv.phone ? 'active' : ''}" data-phone="${conv.phone}">
            <div class="chat-item-header">
              <span class="chat-item-phone">${conv.phone}</span>
              <span class="chat-item-time">${lastUpdated}</span>
            </div>
            <div class="chat-item-preview">${preview}...</div>
          </li>
        `;
      }).join("");

      document.querySelectorAll(".chat-item").forEach(item => {
        item.addEventListener("click", () => selectChat(item.dataset.phone));
      });
    }

    function selectChat(phone) {
      selectedPhone = phone;
      const conv = allConversations.find(c => c.phone === phone);
      if (!conv) return;

      chatTitle.textContent = phone;
      chatMeta.textContent = `Updated ${new Date(conv.updated_at).toLocaleString()}`;
      messagesContent.textContent = conv.messages;
      noChat.style.display = "none";
      chatContent.style.display = "flex";
      renderChatList();
    }

    phoneFilter.addEventListener("input", () => {
      offset = 0;
      loadConversations();
    });

    sendForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!selectedPhone) return;

      const button = sendForm.querySelector("button");
      const input = sendForm.querySelector("input");
      button.disabled = true;
      statusEl.textContent = "Sending...";

      try {
        const formData = new FormData();
        formData.set("to", selectedPhone);
        formData.set("body", input.value);
        const response = await fetch("/send", {
          method: "POST",
          body: formData
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "Send failed");
        statusEl.textContent = "Sent";
        setTimeout(() => statusEl.textContent = "", 2000);
        input.value = "";
        loadConversations();
      } catch (error) {
        statusEl.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    loadConversations();
    setInterval(loadConversations, 3000);
  </script>
</body>
</html>
