<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Messages</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #111;
      height: 100vh;
      display: flex;
    }
    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      background: #128c7e;
      color: white;
      padding: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .refresh-btn:hover {
      background: rgba(255,255,255,0.28);
    }
    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .refresh-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.4s ease;
    }
    .refresh-btn.spinning svg {
      animation: spin 0.6s linear;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .container {
      display: flex;
      gap: 0;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    .sidebar {
      width: 320px;
      background: #fff;
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .search-box {
      padding: 8px 12px;
      border-bottom: 1px solid #e5e5e5;
    }
    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      font-size: 13px;
      background: #f0f0f0;
    }
    .chat-list {
      flex: 1;
      overflow-y: scroll;
      list-style: none;
      min-height: 0;
    }
    .chat-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.1s;
    }
    .chat-item:hover {
      background: #f5f5f5;
    }
    .chat-item.active {
      background: #e9e9e9;
    }
    .chat-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .chat-item-phone {
      font-weight: 500;
      font-size: 14px;
    }
    .chat-item-time {
      font-size: 12px;
      color: #999;
    }
    .chat-item-preview {
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item-tags {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .tag {
      display: inline-block;
      background: #128c7e;
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
      min-height: 0;
    }
    .no-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
    }
    .chat-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .send-form {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      gap: 8px;
    }
    .send-form input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      font-size: 13px;
      font-family: inherit;
    }
    .send-form button {
      padding: 10px 16px;
      background: #128c7e;
      color: white;
      border: 0;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    .send-form button:hover {
      background: #0f7066;
    }
    .send-form button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    .messages-view {
      flex: 1;
      min-height: 0;
      overflow-y: scroll;
      padding: 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .messages-content {
      white-space: normal;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.5;
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .message-line {
      display: flex;
    }
    .message-line.outgoing {
      justify-content: flex-end;
    }
    .message-line.incoming {
      justify-content: flex-start;
    }
    .message-bubble {
      max-width: min(100%, 360px);
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message-bubble img,
    .message-bubble video {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }
    .message-caption {
      white-space: pre-wrap;
      font-size: 13px;
      color: #333;
    }
    .message-placeholder {
      color: #999;
      font-size: 13px;
    }
    .status {
      padding: 0 12px;
      color: #666;
      font-size: 13px;
      min-height: 20px;
    }

    /* Custom visible scrollbars */
    .chat-list,
    .messages-view {
      scrollbar-width: thin;
      scrollbar-color: #b7b7b7 #f0f0f0;
    }
    .chat-list::-webkit-scrollbar,
    .messages-view::-webkit-scrollbar {
      width: 10px;
    }
    .chat-list::-webkit-scrollbar-track,
    .messages-view::-webkit-scrollbar-track {
      background: #f0f0f0;
    }
    .chat-list::-webkit-scrollbar-thumb,
    .messages-view::-webkit-scrollbar-thumb {
      background-color: #b7b7b7;
      border-radius: 6px;
      border: 2px solid #f0f0f0;
    }
    .chat-list::-webkit-scrollbar-thumb:hover,
    .messages-view::-webkit-scrollbar-thumb:hover {
      background-color: #128c7e;
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <h1>WhatsApp</h1>
      <button id="refresh-btn" class="refresh-btn" type="button" title="Refresh conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Refresh</span>
      </button>
    </div>

    <div class="container">
      <div class="sidebar">
        <div class="search-box">
          <input id="phone-filter" type="text" placeholder="Search phone...">
        </div>
        <ul class="chat-list" id="chat-list"></ul>
      </div>

      <div class="chat-view">
        <div id="no-chat" class="no-chat">Select a chat to view messages</div>
        <div id="chat-content" class="chat-content" style="display: none;">
          <div style="padding: 16px; border-bottom: 1px solid #e5e5e5;">
            <div id="chat-title" style="font-size: 16px; font-weight: 600;"></div>
            <div id="chat-meta" style="font-size: 12px; color: #999;"></div>
            <div style="margin-top: 12px; display: flex; gap: 8px; align-items: flex-start;">
              <div id="chat-tags-display" style="flex: 1;"></div>
              <button id="edit-tags-btn" style="padding: 4px 8px; background: #f0f0f0; border: 1px solid #e5e5e5; border-radius: 6px; cursor: pointer; font-size: 12px;">Edit Tags</button>
            </div>
            <div id="chat-tags-edit" style="margin-top: 12px; display: none; gap: 8px; align-items: center;">
              <input id="tags-input" type="text" placeholder="Enter tags separated by commas..." style="flex: 1; padding: 8px 12px; border: 1px solid #e5e5e5; border-radius: 6px; font-size: 13px;">
              <button id="save-tags-btn" style="padding: 6px 12px; background: #128c7e; color: white; border: 0; border-radius: 6px; cursor: pointer; font-size: 12px;">Save</button>
              <button id="cancel-tags-btn" style="padding: 6px 12px; background: #f0f0f0; border: 1px solid #e5e5e5; border-radius: 6px; cursor: pointer; font-size: 12px;">Cancel</button>
            </div>
          </div>
          <div class="status" id="status"></div>
          <div class="messages-view">
            <div class="messages-content" id="messages-content"></div>
          </div>
          <form id="send-form" class="send-form">
            <input name="body" type="text" placeholder="Type a message..." required>
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script>
    const chatList = document.querySelector("#chat-list");
    const phoneFilter = document.querySelector("#phone-filter");
    const noChat = document.querySelector("#no-chat");
    const chatContent = document.querySelector("#chat-content");
    const chatTitle = document.querySelector("#chat-title");
    const chatMeta = document.querySelector("#chat-meta");
    const messagesContent = document.querySelector("#messages-content");
    const sendForm = document.querySelector("#send-form");
    const statusEl = document.querySelector("#status");
    const chatTagsDisplay = document.querySelector("#chat-tags-display");
    const chatTagsEdit = document.querySelector("#chat-tags-edit");
    const editTagsBtn = document.querySelector("#edit-tags-btn");
    const saveTagsBtn = document.querySelector("#save-tags-btn");
    const cancelTagsBtn = document.querySelector("#cancel-tags-btn");
    const tagsInput = document.querySelector("#tags-input");
    const refreshBtn = document.querySelector("#refresh-btn");
    const pageSize = 50;
    let offset = 0;
    let selectedPhone = null;
    let allConversations = [];

    function parseTags(tagString) {
      if (!tagString.trim()) return [];
      return tagString.split(",").map(tag => tag.trim()).filter(Boolean);
    }

    function renderTagElements(tags) {
      return tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
    }

    function displayTags(conversation) {
      const tags = parseTags(conversation.tags);
      if (tags.length === 0) {
        chatTagsDisplay.innerHTML = '<span style="color: #999; font-size: 12px;">No tags</span>';
      } else {
        chatTagsDisplay.innerHTML = `<div class="chat-item-tags">${renderTagElements(tags)}</div>`;
      }
    }

    async function loadConversations() {
      const params = new URLSearchParams({ limit: pageSize, offset });
      if (phoneFilter.value.trim()) params.set("phone", phoneFilter.value.trim());
      const response = await fetch(`/messages?${params}`);
      allConversations = await response.json();
      renderChatList();

      // Keep the open chat's messages/tags in sync with the fresh data.
      if (selectedPhone) {
        const conv = allConversations.find(c => c.phone === selectedPhone);
        if (conv) {
          chatMeta.textContent = `Updated ${new Date(conv.updated_at).toLocaleString()}`;
          if (chatTagsEdit.style.display !== "flex") {
            displayTags(conv);
          }
          renderMessages(conv.messages);
        }
      }
    }

    async function refreshConversations() {
      refreshBtn.disabled = true;
      refreshBtn.classList.add("spinning");
      try {
        await loadConversations();
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.classList.remove("spinning");
      }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function renderMessageLine(line) {
      const separatorIndex = line.indexOf(':');
      const direction = separatorIndex >= 0 ? line.substring(0, separatorIndex) : '';
      const content = separatorIndex >= 0 ? line.substring(separatorIndex + 1) : line;
      const bubbleClass = direction === 'me' ? 'outgoing' : 'incoming';

      if (content.startsWith('media:image:')) {
        const mediaData = content.slice('media:image:'.length);
        const [mediaUrl = '', ...captionParts] = mediaData.split('|');
        const caption = captionParts.join('|');
        return `
          <div class="message-line ${bubbleClass}">
            <div class="message-bubble">
              ${mediaUrl ? `<img src="${escapeHtml(mediaUrl)}" alt="Image attachment" loading="lazy">` : '<div class="message-placeholder">Image attachment unavailable</div>'}
              ${caption ? `<div class="message-caption">${escapeHtml(caption)}</div>` : ''}
            </div>
          </div>
        `;
      }

      if (content.startsWith('media:video:')) {
        const mediaData = content.slice('media:video:'.length);
        const [mediaUrl = '', ...captionParts] = mediaData.split('|');
        const caption = captionParts.join('|');
        return `
          <div class="message-line ${bubbleClass}">
            <div class="message-bubble">
              ${mediaUrl ? `<video controls preload="metadata" src="${escapeHtml(mediaUrl)}"></video>` : '<div class="message-placeholder">Video attachment unavailable</div>'}
              ${caption ? `<div class="message-caption">${escapeHtml(caption)}</div>` : ''}
            </div>
          </div>
        `;
      }

      return `
        <div class="message-line ${bubbleClass}">
          <div class="message-bubble">
            <div class="message-caption">${escapeHtml(content)}</div>
          </div>
        </div>
      `;
    }

    function renderMessages(messages) {
      const lines = messages.split('\n').filter(Boolean);
      messagesContent.innerHTML = lines.map(renderMessageLine).join('');
    }

    function renderChatList() {
      chatList.innerHTML = allConversations.map((conv) => {
        const preview = conv.messages.split('\n').filter(Boolean)[0] || '';
        const previewText = preview.startsWith('media:image:') || preview.startsWith('media:video:')
          ? '[image/video attachment]'
          : preview.substring(0, 40);
        const lastUpdated = new Date(conv.updated_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const tags = parseTags(conv.tags);
        const tagsHtml = tags.length > 0 ? `<div class="chat-item-tags">${renderTagElements(tags.slice(0, 2))}</div>` : '';
        return `
          <li class="chat-item ${selectedPhone === conv.phone ? 'active' : ''}" data-phone="${conv.phone}">
            <div class="chat-item-header">
              <span class="chat-item-phone">${conv.phone}</span>
              <span class="chat-item-time">${lastUpdated}</span>
            </div>
            <div class="chat-item-preview">${previewText}...</div>
            ${tagsHtml}
          </li>
        `;
      }).join("");

      document.querySelectorAll(".chat-item").forEach(item => {
        item.addEventListener("click", () => selectChat(item.dataset.phone));
      });
    }

    function selectChat(phone) {
      selectedPhone = phone;
      const conv = allConversations.find(c => c.phone === phone);
      if (!conv) return;

      chatTitle.textContent = phone;
      chatMeta.textContent = `Updated ${new Date(conv.updated_at).toLocaleString()}`;
      displayTags(conv);
      renderMessages(conv.messages);
      noChat.style.display = "none";
      chatContent.style.display = "flex";
      chatTagsEdit.style.display = "none";
      tagsInput.value = conv.tags;
      renderChatList();
    }

    phoneFilter.addEventListener("input", () => {
      offset = 0;
      loadConversations();
    });

    refreshBtn.addEventListener("click", () => {
      refreshConversations();
    });

    editTagsBtn.addEventListener("click", () => {
      chatTagsDisplay.parentElement.style.display = "none";
      chatTagsEdit.style.display = "flex";
      tagsInput.focus();
    });

    cancelTagsBtn.addEventListener("click", () => {
      chatTagsDisplay.parentElement.style.display = "flex";
      chatTagsEdit.style.display = "none";
      const conv = allConversations.find(c => c.phone === selectedPhone);
      if (conv) tagsInput.value = conv.tags;
    });

    saveTagsBtn.addEventListener("click", async () => {
      if (!selectedPhone) return;

      saveTagsBtn.disabled = true;
      try {
        const formData = new FormData();
        formData.set("tags", tagsInput.value);
        const response = await fetch(`/tags/${selectedPhone}`, {
          method: "POST",
          body: formData
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "Failed to update tags");
        
        const conv = allConversations.find(c => c.phone === selectedPhone);
        if (conv) {
          conv.tags = result.tags;
          displayTags(conv);
          renderChatList();
        }
        
        chatTagsDisplay.parentElement.style.display = "flex";
        chatTagsEdit.style.display = "none";
      } catch (error) {
        alert("Error updating tags: " + error.message);
      } finally {
        saveTagsBtn.disabled = false;
      }
    });

    tagsInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        saveTagsBtn.click();
      } else if (e.key === "Escape") {
        e.preventDefault();
        cancelTagsBtn.click();
      }
    });

    sendForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!selectedPhone) return;

      const button = sendForm.querySelector("button");
      const input = sendForm.querySelector("input");
      button.disabled = true;
      statusEl.textContent = "Sending...";

      try {
        const formData = new FormData();
        formData.set("to", selectedPhone);
        formData.set("body", input.value);
        const response = await fetch("/send", {
          method: "POST",
          body: formData
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "Send failed");
        statusEl.textContent = "Sent";
        setTimeout(() => statusEl.textContent = "", 2000);
        input.value = "";
        loadConversations();
      } catch (error) {
        statusEl.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    loadConversations();
  </script>
</body>
</html>
